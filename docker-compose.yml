services:
  # Service Discovery
  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    networks:
      - homework-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Config Server
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    networks:
      - homework-network
    depends_on:
      discovery-service:
        condition: service_healthy

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - config-server
      - discovery-service
    networks:
      - homework-network

  # User Service
  user-service:
    build: ./user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - config-server
      - discovery-service
      - postgres
      - kafka
    networks:
      - homework-network

  # Notification Service
  notification-service:
    build: ./notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - config-server
      - discovery-service
      - kafka
    networks:
      - homework-network

  # PostgreSQL
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: homework
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - homework-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U testuser" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka и Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - homework-network
    healthcheck:
      test: [ "CMD-SHELL", "echo stat | nc 127.0.0.1 2181 | grep Mode" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "userAdd-topic:1:1,userDelete-topic:1:1"
    ports:
      - "9092:9092"
    networks:
      - homework-network

volumes:
  postgres-data:

networks:
  homework-network:
    driver: bridge